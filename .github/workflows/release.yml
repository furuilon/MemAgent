name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-amd64
            artifact: MemAgent-windows-amd64
          - os: macos-latest
            platform: darwin-arm64
            artifact: MemAgent-darwin-arm64
          - os: ubuntu-latest
            platform: linux-amd64
            artifact: MemAgent-linux-amd64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python deps
        run: pip install -r backend/requirements.txt

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Sync frontend dist (Windows)
        if: runner.os == 'Windows'
        run: |
          if (Test-Path backend/frontend_dist) { Remove-Item backend/frontend_dist -Recurse -Force }
          Copy-Item frontend/dist backend/frontend_dist -Recurse
        shell: pwsh

      - name: Sync frontend dist (Unix)
        if: runner.os != 'Windows'
        run: |
          rm -rf backend/frontend_dist
          cp -r frontend/dist backend/frontend_dist
        shell: bash

      - name: Generate icon
        run: python backend/scripts/gen_icon.py
        shell: bash

      - name: Build backend (PyInstaller)
        run: pyinstaller --noconfirm --clean MemAgent.spec
        working-directory: backend
        shell: bash

      - name: Install NSIS
        if: runner.os == 'Windows'
        run: choco install nsis -y

      - name: Build Windows installer (NSIS)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          & "C:\Program Files (x86)\NSIS\makensis.exe" installer/installer.nsi
          Compress-Archive -Path backend/dist/MemAgent -DestinationPath release/MemAgent-windows-amd64-portable.zip -Force
        shell: pwsh

      - name: Package artifacts (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          mkdir -p release
          tar -czf release/${{ matrix.artifact }}.tar.gz -C backend/dist MemAgent 2>/dev/null || tar -czf release/${{ matrix.artifact }}.tar.gz -C backend/dist . 2>/dev/null || echo "no dist to pack"
          ls -lh release/
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/*
          if-no-files-found: warn

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/*
          generate_release_notes: true
